<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Training</title><meta name="theme-color" content="#0c0e0f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Training"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style></head><body><script>window.APP_MODE="pages";</script><style>/* 版面：單欄手機版面，最大 560px 置中；底部固定導覽列。深色鐵灰底，黃銅色為唯一強調色，紅色只用在肌肉圖與 PR。 */
:root {
  --bg: #0c0e0f;
  --s1: #15181a;
  --s2: #1d2124;
  --s3: #262b2f;
  --line: #2b3135;
  --tx: #eceeef;
  --mu: #9aa3a9;
  --dim: #69737a;
  --brass: #d4a24c;
  --brass-hi: #e7bb69;
  --brass-ink: #1b1407;
  --brass-soft: rgba(212, 162, 76, .14);
  --red: #e5533d;
  --red-soft: #f0a090;
  --ok: #62c08f;
  --ok-soft: rgba(98, 192, 143, .14);
  --warn: #f08a4b;
  --warn-soft: rgba(240, 138, 75, .14);
  --info: #7fa8d6;
  --ff: "Barlow", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --fd: "Barlow Condensed", "Barlow", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  --r: 14px;
  --nav-h: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--tx); }
body { margin: 0; font-family: var(--ff); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.num { font-family: var(--fd); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
#app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px));
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0 14px; }
.top h1 { font-family: var(--fd); font-size: 30px; font-weight: 600; margin: 0; letter-spacing: .02em; line-height: 1.1; }
.top .sub { color: var(--mu); font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.flat { background: transparent; }
.card h2, .sec-title { font-size: 13px; font-weight: 600; color: var(--mu); letter-spacing: .08em; margin: 0 0 10px; }
.card h3 { font-size: 17px; margin: 0; font-weight: 600; }
.muted { color: var(--mu); }
.dim { color: var(--dim); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.big { font-family: var(--fd); font-size: 40px; font-weight: 600; line-height: 1; }
.mid { font-family: var(--fd); font-size: 26px; font-weight: 600; line-height: 1.05; }
.hr { height: 1px; background: var(--line); margin: 12px 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--s2); color: var(--tx); font-weight: 600; font-size: 15px; white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn.pri { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
.btn.pri:active { background: var(--brass-hi); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--red); border-color: rgba(229,83,61,.35); background: transparent; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--s1); display: inline-grid; place-items: center; flex: none; }
.icon-btn svg, .btn svg { width: 18px; height: 18px; }
svg.i { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 0 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--s2); color: var(--mu); font-size: 13px; white-space: nowrap;
}
.chip.on { background: var(--brass-soft); border-color: var(--brass); color: var(--brass-hi); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--s3); color: var(--mu); white-space: nowrap; }
.tag.brass { background: var(--brass-soft); color: var(--brass-hi); }
.tag.red { background: rgba(229,83,61,.16); color: #ff8a77; }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.note { border-radius: 12px; padding: 10px 12px; font-size: 14px; background: var(--s2); border: 1px solid var(--line); }
.note.brass { background: var(--brass-soft); border-color: rgba(212,162,76,.45); }
.note.warn { background: var(--warn-soft); border-color: rgba(240,138,75,.45); }
.note.ok { background: var(--ok-soft); border-color: rgba(98,192,143,.4); }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--mu); min-width: 0; }
.inp, select.inp, textarea.inp {
  width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--s2);
  padding: 8px 12px; font-size: 16px; color: var(--tx); min-width: 0;
}
textarea.inp { min-height: 80px; resize: vertical; line-height: 1.5; }
.inp:focus { border-color: var(--brass); outline: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .t { font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--s3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--brass); }
.bar.ok > i { background: var(--ok); }
.bar.warn > i { background: var(--warn); }
.seg { display: flex; background: var(--s1); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; min-height: 36px; border: 0; background: transparent; color: var(--mu); border-radius: 9px; font-weight: 600; font-size: 14px; }
.seg button.on { background: var(--s3); color: var(--tx); }

/* 導覽列 */
#nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(12,14,15,.94);
  border-top: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
#nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
#nav button { border: 0; background: transparent; color: var(--dim); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; }
#nav button svg { width: 22px; height: 22px; }
#nav button.on { color: var(--brass-hi); }
#nav .dot { position: relative; }
#nav .dot::after { content: ""; position: absolute; top: -2px; right: -4px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }

/* 休息計時 */
#timer {
  position: fixed; left: 0; right: 0; z-index: 19; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-bottom: 8px;
}
#timer .in { max-width: 536px; margin: 0 auto; background: var(--s3); border: 1px solid var(--brass); border-radius: 14px; padding: 8px 10px 8px 14px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
#timer .t { font-family: var(--fd); font-size: 26px; font-weight: 600; min-width: 64px; }
#timer .tl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#timer svg.i { width: 20px; height: 20px; color: var(--brass); }
@media (max-width: 360px) { #timer .tl { display: none; } }
#timer.done .in { border-color: var(--ok); }

/* 底部面板 */
#layer { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
.sheet-wrap { position: absolute; inset: 0; pointer-events: auto; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.55); }
.sheet {
  width: 100%; max-width: 560px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); background: var(--bg);
  border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden;
  animation: up .22s ease-out;
}
.sheet.full { max-height: 100%; height: 100%; border-radius: 0; border: 0; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-h { display: flex; align-items: center; gap: 10px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); flex: none; }
.sheet.full .sheet-h { padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
.sheet-h h3 { margin: 0; font-size: 17px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-b { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); flex: 1; }
.sheet-f { flex: none; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); display: flex; gap: 10px; background: var(--bg); }
.sheet-f .btn { flex: 1; }
.dialog-wrap { position: absolute; inset: 0; pointer-events: auto; display: grid; place-items: center; background: rgba(0,0,0,.6); padding: 24px; }
.dialog { width: 100%; max-width: 380px; background: var(--s1); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
.dialog p { margin: 0 0 16px; line-height: 1.6; }

#toast { position: fixed; left: 0; right: 0; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 60; display: flex; justify-content: center; pointer-events: none; padding: 0 16px; }
#toast .in { background: var(--s3); border: 1px solid var(--line); color: var(--tx); border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.4); max-width: 520px; }
#toast .in.pr { border-color: var(--red); }

/* 今日 */
.hero-day { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.hero-day .d { font-family: var(--fd); font-size: 44px; font-weight: 700; line-height: .95; letter-spacing: .01em; }
.ring { position: relative; width: 116px; height: 116px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.macro { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.ex-mini { display: flex; flex-wrap: wrap; gap: 6px; }

/* 訓練 */
.exc { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.exc.open { border-color: rgba(212,162,76,.5); }
.exc-h { display: flex; align-items: center; gap: 12px; padding: 12px; width: 100%; border: 0; background: transparent; text-align: left; }
.thumb { position: relative; width: 56px; height: 56px; border-radius: 10px; background: #fff; flex: none; overflow: hidden; display: grid; place-items: center; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.thumb.photo img { object-fit: cover; }
.thumb.none { background: var(--s3); color: var(--dim); font-size: 11px; text-align: center; padding: 4px; }
.exc-b { padding: 0 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.setrow { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; background: var(--s2); border: 0; width: 100%; text-align: left; }
.setrow .n { font-family: var(--fd); color: var(--dim); font-size: 18px; text-align: center; }
.entry { background: var(--s2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.stepper { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 6px; align-items: center; }
.stepper button { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--s3); font-size: 20px; font-weight: 600; }
.stepper .inp { text-align: center; font-family: var(--fd); font-size: 22px; font-weight: 600; padding: 4px; }
.lbl { font-size: 12px; color: var(--mu); margin-bottom: 4px; display: block; }

/* 圖片 */
.figs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fig { position: relative; border-radius: 12px; background: #fff; aspect-ratio: 1 / 1; overflow: hidden; display: grid; place-items: center; max-width: 100%; }
.fig img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.fig.photo img { object-fit: cover; }
.fig.wide { grid-column: span 2; aspect-ratio: 4 / 3; }
.bodymap { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-width: 360px; margin: 0 auto; }
.bodymap svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 12px; color: var(--mu); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
ol.cues { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
ol.cues li::marker { color: var(--brass); font-family: var(--fd); font-weight: 600; }

/* 動作庫 */
.lib-item { display: flex; gap: 12px; align-items: center; padding: 10px; background: var(--s1); border: 1px solid var(--line); border-radius: 14px; width: 100%; text-align: left; }
.lib-item .thumb { width: 64px; height: 64px; }

/* 器材勾選 */
.eq-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.eq { border: 1px solid var(--line); background: var(--s1); border-radius: 14px; padding: 8px; text-align: left; display: flex; flex-direction: column; gap: 6px; position: relative; width: 100%; }
.eq .fig { aspect-ratio: 4/3; }
.eq.on { border-color: var(--brass); background: #1c1a14; }
.eq .ck { position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); background: rgba(0,0,0,.35); display: grid; place-items: center; }
.eq.on .ck { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
.eq .ck svg { width: 14px; height: 14px; stroke-width: 3; }
.eq .nm { font-weight: 600; font-size: 14px; line-height: 1.3; }
.eq .ds { font-size: 12px; color: var(--mu); line-height: 1.4; }

/* 圖表 */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--dim); font-size: 10px; font-family: var(--ff); }

/* 新手引導 */
.ob-step { display: flex; gap: 6px; }
.ob-step i { flex: 1; height: 4px; border-radius: 4px; background: var(--s3); }
.ob-step i.on { background: var(--brass); }
.opt { border: 1px solid var(--line); border-radius: 14px; background: var(--s1); padding: 12px 14px; text-align: left; width: 100%; display: flex; flex-direction: column; gap: 2px; }
.opt.on { border-color: var(--brass); background: #1c1a14; }
.opt b { font-size: 15px; }
.opt span { color: var(--mu); font-size: 13px; }
.kpi { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi > div { background: var(--s2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.kpi .v { font-family: var(--fd); font-size: 24px; font-weight: 600; line-height: 1.1; }
.kpi .k { font-size: 12px; color: var(--mu); }
.photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.photo-grid button { padding: 0; border: 0; border-radius: 10px; overflow: hidden; aspect-ratio: 3/4; background: var(--s2); }
.photo-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hidden-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.empty { text-align: center; color: var(--mu); padding: 18px 8px; font-size: 14px; }
@media (min-width: 720px) {
  .top h1 { font-size: 34px; }
}

.lib-item svg.i, .li svg.i.dim { width: 18px; height: 18px; }
.note svg.i { vertical-align: -0.18em; }

.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; min-width: 0; }
.exc.done { border-color: rgba(98,192,143,.35); }
.exc.done:not(.open) .thumb { opacity: .7; }
.exc-h .grow { min-width: 0; }
.mline { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px dashed var(--line); background: transparent; color: var(--tx); font-size: 14px; text-align: left; }
.mline svg { color: var(--brass); }
.sets { display: grid; grid-template-columns: 26px minmax(0, 1fr) 76px 60px 46px; gap: 6px 6px; align-items: center; }
.sets .sh { font-size: 11px; color: var(--dim); text-align: center; letter-spacing: .04em; }
.sets .sh:nth-child(2) { text-align: left; }
.srow { display: contents; }
.srow .c { min-height: 46px; display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.srow .n { color: var(--dim); font-size: 16px; }
.srow .prev { justify-content: flex-start; color: var(--dim); font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; }
.srow.done .c.v { color: var(--tx); }
.srow.done .c.n { color: var(--ok); }
button.srow { all: unset; display: contents; cursor: pointer; }
.srow.ghost .c { color: var(--dim); }
.srow .ck { border-radius: 10px; border: 1px solid var(--line); background: var(--s3); color: var(--mu); padding: 0; min-height: 46px; width: 46px; }
.srow .ck.on { background: var(--ok); color: #0c1a12; border-color: var(--ok); }

.srow.ghost .ck { background: transparent; border-style: dashed; }
.srow.act .ck { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
.srow .ck svg { width: 22px; height: 22px; stroke-width: 2.6; }
.srow .pr { font-family: var(--fd); font-size: 13px; color: #0c1a12; }
.cell { width: 100%; min-width: 0; height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--s2); text-align: center; font-family: var(--fd); font-size: 20px; font-weight: 600; color: var(--tx); padding: 0 4px; }
.cell:focus { outline: none; border-color: var(--brass); background: var(--s3); }
.rirbox { grid-column: 1 / -1; background: var(--s2); border-radius: 10px; padding: 8px 10px; }

.sbtn { border: 0; background: transparent; padding: 0; min-height: 40px; display: inline-flex; align-items: center; }
.sb { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--mu); background: var(--s1); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
.sb svg { width: 15px; height: 15px; }
.sb-ok { color: var(--ok); }
.sb-err { color: var(--warn); border-color: rgba(240,138,75,.45); }

.rxbar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.rxbar span { background: var(--s2); border-radius: 10px; padding: 7px 4px; text-align: center; font-size: 12px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.warnbox ul li:first-child { display: none; }
.warncard h2 { color: var(--warn); display: flex; align-items: center; gap: 6px; }
.warnlist { padding-bottom: 0; font-size: 14px; }
.tslot { border-top: 1px solid var(--line); padding-top: 10px; }
.tslot:first-child { border-top: 0; padding-top: 0; }

.btn.choice { flex-direction: column; align-items: center; height: auto; min-height: 52px; padding: 10px 14px; gap: 2px; white-space: normal; text-align: center; line-height: 1.3; }
.btn.choice .xs { display: block; font-weight: 400; opacity: .8; white-space: normal; }

.daylock { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--ok-soft, rgba(98,192,143,.12)); border: 1px solid rgba(98,192,143,.35); }
.daylock svg { color: var(--ok); flex: none; }
.daylock.skip { background: var(--s2); border-color: var(--line); }
.daylock .btn { flex: none; }
.fhist summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
.fhist summary::-webkit-details-marker { display: none; }
.fhist summary > svg { transform: rotate(90deg); transition: transform .2s; flex: none; }

.fhist .fh-head, .fhist .fh-row { display: grid; grid-template-columns: 1.15fr 1fr 1fr 1.05fr; gap: 6px; align-items: center; }
.fhist .fh-head { margin-top: 12px; padding: 0 8px 6px; font-size: 12px; color: var(--dim); border-bottom: 1px solid var(--line); }
.fhist .fh-row { width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); color: var(--tx); padding: 8px; font: inherit; font-size: 14px; min-height: 48px; border-radius: 8px; }
.fhist .fh-row.on { background: var(--s2); }

.fhist .fh-row .tag { white-space: nowrap; font-size: 11px; }
.fhist .fh-row .tag svg { width: 11px; height: 11px; }

<script>/* ===== 工具 ===== */
const pad2 = n => String(n).padStart(2, '0');
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayStr() { return ymd(new Date()); }
function addDays(s, n) { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); }
function diffDays(a, b) { const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number); return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 864e5); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const r1 = x => Math.round(x * 10) / 10;
const r05 = x => Math.round(x * 2) / 2;
function fmtNum(x) { if (x == null || isNaN(x)) return '–'; return (Math.round(x * 10) / 10).toString(); }
function tzName() { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; } }
const WD = ['日', '一', '二', '三', '四', '五', '六'];
function mdLabel(s) { const [y, m, d] = s.split('-').map(Number); return m + '/' + d + '（' + WD[new Date(y, m - 1, d).getDay()] + '）'; }

  if (!sets.length) { if (await confirmBox('這次還沒有記錄任何工作組，要放棄這次訓練嗎？', '放棄', true)) { S.sessions = S.sessions.filter(x => x !== s); save(); render(); } return; }
  const left = s.plan.filter(id => !(s.done || {})[id] && S.sets.filter(x => x.sid === s.id && x.ex === id && !x.warm).length < sessionRx(S, s, EXMAP[id]).sets);
  let mode = 'done';
  if (left.length) {
    mode = await choiceBox('還有 ' + left.length + ' 個動作沒做完：' + left.map(id => esc(EXMAP[id].name)).join('、') + '。', [
      { label: '繼續訓練', v: null },
      { label: '結束，算' + DAY_NAME[s.day] + '練完了', sub: '保存紀錄，下一次換下一天', v: 'done', cls: 'pri' },
      { label: '結束，下次再練一次' + DAY_NAME[s.day], sub: '保存已做的組數，但循環不往前（身體不舒服、時間不夠時用）', v: 'partial' }
    ]);
    if (!mode) return;
  }
  s.end = new Date().toTimeString().slice(0, 5); s.endTs = Date.now();
  if (mode === 'partial') { s.partial = true; toast('已保存，下次還是' + DAY_NAME[s.day]); } else advanceCycle(S, s.date);
  stopTimer(); save(); scheduleSync(800);
  openSheet('summary', sheetSummary(s.id)); render();
};
A.cancelSession = async () => { if (!(await confirmBox('放棄這次紀錄？已記錄的組數會全部刪除。', '放棄', true))) return; const s = liveSession(); S.sets = S.sets.filter(x => x.sid !== s.id); S.sessions = S.sessions.filter(x => x !== s); stopTimer(); save(); render(); };
function sheetSummary(sid) {
  return () => {
    const s = sessionById(S, sid); const sets = S.sets.filter(x => x.sid === sid && !x.warm);
    let vol = 0; for (const st of sets) { const e = EXMAP[st.ex]; if (e) vol += setVolume(e, st, S); }
    const mins = s.endTs && s.startTs ? Math.round((s.endTs - s.startTs) / 60000) : null;
    const prs = sets.filter(x => x.pr);
    const byEx = {}; for (const st of S.sets.filter(x => x.sid === sid)) (byEx[st.ex] = byEx[st.ex] || []).push(st);
    let b = '<div class="stack"><div class="kpi">' + kpi('組數', sets.length) + kpi('容量', Math.round(vol).toLocaleString() + ' kg') + kpi('時間', mins != null ? mins + ' 分鐘' : s.start + '–' + (s.end || '')) + kpi('破紀錄', prs.length + ' 個') + '</div>';
    if (prs.length) b += '<div class="note" style="border-color:var(--red)">' + prs.map(x => '<div>' + ic('star') + ' ' + esc(EXMAP[x.ex].name) + '：' + fmtSet(EXMAP[x.ex], x) + '（' + esc(x.pr) + '）</div>').join('') + '</div>';
    b += '<div class="card"><div class="list">' + Object.keys(byEx).map(id => '<div class="li"><div class="grow"><div class="t">' + esc(EXMAP[id] ? EXMAP[id].name : id) + '</div><div class="small muted">' + byEx[id].sort((a, b2) => a.n - b2.n).map(st => (st.warm ? '熱 ' : '') + fmtSet(EXMAP[id], st)).join('、') + '</div></div></div>').join('') + '</div></div>';
    if (s.end && UI.sheets.some(x => x.id === 'summary')) b += '<div class="note brass">下一次：' + DAY_NAME[ORDER[S.settings.cycle.idx]] + (ORDER[S.settings.cycle.idx] === 'rest' ? '，之後是推日' : '') + '。記得練完 2 小時內補蛋白質。</div>';
    b += '<button class="btn danger block" data-a="delSession" data-v="' + sid + '">刪除這次訓練</button></div>';
    return { title: DAY_NAME[s.day] + '・' + mdLabel(s.date), body: b };
  };
}

let TM = null, audioCtx = null;
function ensureAudio() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) { } }
function beep() { try { ensureAudio(); const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.25, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6); o.start(); o.stop(audioCtx.currentTime + 0.6); } catch (e) { } try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { } }
function startTimer(sec) { TM = { end: Date.now() + sec * 1000, beeped: false }; drawTimer(); }
function stopTimer() { TM = null; drawTimer(); }
function drawTimer() {
  const el = $('#timer');
  if (!TM) { el.hidden = true; el.innerHTML = ''; return; }
  const left = Math.round((TM.end - Date.now()) / 1000);
  if (left <= 0 && !TM.beeped) { TM.beeped = true; beep(); }
  if (left < -60) { stopTimer(); return; }
  el.hidden = false; el.className = left <= 0 ? 'done' : '';
  const a = Math.abs(left); const t = (left < 0 ? '+' : '') + Math.floor(a / 60) + ':' + pad2(a % 60);
  el.innerHTML = '<div class="in">' + ic('clock') + '<span class="t">' + t + '</span><span class="small muted grow tl">' + (left > 0 ? '組間休息' : '可以做下一組了') + '</span><button class="btn sm" data-a="tmAdd" data-v="-15">−15</button><button class="btn sm" data-a="tmAdd" data-v="15">+15</button><button class="btn sm ghost" data-a="tmStop" aria-label="關閉計時">' + ic('x') + '</button></div>';
}

        '<label class="f">名稱<input class="inp" id="bc-name" value="' + esc(f.name) + '"></label><label class="f">單位<input class="inp" id="bc-unit" value="' + esc(f.unit) + '" placeholder="例如：1 包、100g"></label>' +
        '<div class="grid2"><label class="f">熱量<input class="inp" id="bc-k" inputmode="decimal" value="' + esc(f.kcal) + '"></label><label class="f">蛋白質 g<input class="inp" id="bc-p" inputmode="decimal" value="' + esc(f.p) + '"></label><label class="f">碳水 g<input class="inp" id="bc-c" inputmode="decimal" value="' + esc(f.c) + '"></label><label class="f">脂肪 g<input class="inp" id="bc-f" inputmode="decimal" value="' + esc(f.f) + '"></label></div></div>',
      foot: '<button class="btn pri" data-a="saveBarcodeFood" data-v="' + meal + '">儲存並加入' + mealName + '</button>'
    };
  };
}
A.saveBarcodeFood = meal => {
  const name = $('#bc-name').value.trim(); const k = parseFloat($('#bc-k').value);
  if (!name || !(k >= 0)) { toast('請輸入名稱和熱量'); return; }
  const f = { id: 'u' + uid(), barcode: UI.bc.barcode, name, unit: $('#bc-unit').value.trim() || '1 份', kcal: k, p: parseFloat($('#bc-p').value) || 0, c: parseFloat($('#bc-c').value) || 0, f: parseFloat($('#bc-f').value) || 0, src: 'bc' };
  S.foods.push(f); if (!S.settings.favFoods.includes(f.id)) S.settings.favFoods.push(f.id);
  save(); closeSheet('bcfood'); closeSheet('addfood');
  UI.qty = 1; UI.qtyFood = f; UI.qtyMeal = meal; openSheet('qty', sheetQty(f, meal));
};

/* ===== 啟動 ===== */
async function boot() {
  $('#nav').innerHTML = '<div class="in">' + [['today', 'home', '今日'], ['train', 'dumbbell', '訓練'], ['food', 'bowl', '飲食'], ['progress', 'chart', '進度'], ['library', 'book', '動作']].map(([k, i, l]) => '<button data-a="tab" data-v="' + k + '" data-tab="' + k + '"><span class="ico">' + ic(i) + '</span>' + l + '</button>').join('') + '</div>';
  await Store.open();
  await loadSync();
  const st = await Store.get('state');
  S = migrate(st);
  buildExMap(S);
  if (!S.profile) { UI.ob = obDefaults(); openSheet('ob', sheetOnboard, { full: true, noClose: true }); }
  render();
  if (SYNC.cfg) { SYNC.pending = syncDiff().length; drawSyncBadge(); setTimeout(() => syncNow(), 1500); }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && SYNC.cfg && SYNC.pending) syncNow(); if (document.visibilityState === 'visible' && SYNC.cfg) scheduleSync(2000); });
  window.addEventListener('online', () => scheduleSync(1500));
  if (IS_PAGES && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) { } }
  let lastDay = todayStr();
  setInterval(() => { const d = todayStr(); if (d !== lastDay) { lastDay = d; render(); } }, 60000);
}
boot();
</script>
</body></html>
